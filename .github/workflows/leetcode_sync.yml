name: Sync Leetcode Topic Wise

on:
  workflow_dispatch: # Allows you to run it manually anytime
  schedule:
    - cron: '0 0 * * *' # Automatically runs daily at midnight UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync LeetCode Solutions
        uses: joshcai/leetcode-sync@6749b872e89b3c10d213a6e599a7424584c1fa10
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: 'raw-submissions'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Reorganize into Topic Folders
        run: python .github/scripts/organize_by_topic.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-organized LeetCode solutions into topic folders" || exit 0
          git push
